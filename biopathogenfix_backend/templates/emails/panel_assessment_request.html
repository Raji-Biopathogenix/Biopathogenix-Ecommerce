<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>New Free Panel Assessment Request</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #1d3557; line-height: 1.6;">
    <h2 style="margin-bottom: 8px;">New Free Panel Assessment Request</h2>
    <p style="margin-top: 0;">A new request has been submitted from the {{ source_label }}.</p>

    <table cellpadding="6" cellspacing="0" border="0" style="border-collapse: collapse;">
      <tr>
        <td><strong>Name:</strong></td>
        <td>{{ name }}</td>
      </tr>
      <tr>
        <td><strong>Work Email:</strong></td>
        <td>{{ email }}</td>
      </tr>
      <tr>
        <td><strong>Organization:</strong></td>
        <td>{{ org }}</td>
      </tr>
      <tr>
        <td><strong>Phone:</strong></td>
        <td>{{ phone }}</td>
      </tr>
      <tr>
        <td><strong>Application Area:</strong></td>
        <td>{{ interest }}</td>
      </tr>
      <tr>
        <td><strong>Targets &amp; Multiplex Format:</strong></td>
        <td>{{ message|linebreaksbr }}</td>
      </tr>
    </table>
  </body>
</html>
